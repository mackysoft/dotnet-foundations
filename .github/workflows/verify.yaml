name: verify

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: dotnet (${{ matrix.os_name }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runs_on: ubuntu-latest
          - os_name: macos
            runs_on: macos-latest
          - os_name: windows
            runs_on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('DotNetFoundations.slnx', '**/*.csproj', 'eng/package-families/*.props') }}

      - name: Verify source
        run: bash scripts/verify.sh

  package:
    name: package (${{ matrix.family }})
    needs: dotnet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: filesystem
            version: 0.1.0
          - family: text-vocabularies
            version: 0.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack package family
        run: >-
          bash scripts/pack-package-family.sh
          --family "${{ matrix.family }}"
          --version "${{ matrix.version }}"
          --output artifacts/packages

      - name: Verify package family
        run: >-
          bash scripts/verify-package-family.sh
          --family "${{ matrix.family }}"
          --version "${{ matrix.version }}"
          --package-dir artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.family }}-${{ matrix.version }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
