name: package-publish

on:
  workflow_dispatch:
    inputs:
      family:
        description: Package family to publish
        required: true
        type: choice
        options:
          - filesystem
          - json-canonicalization
          - text-vocabularies
      version:
        description: Package family version
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      family: ${{ steps.family.outputs.family }}
      version: ${{ steps.family.outputs.version }}
      tag_name: ${{ steps.family.outputs.tag_name }}
      package_ids: ${{ steps.family.outputs.package_ids }}
      release_sha: ${{ steps.source.outputs.release_sha }}

    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Package releases must run from ${DEFAULT_BRANCH}. Actual ref: ${REF_NAME}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve package family
        id: family
        run: >-
          bash scripts/resolve-package-family.sh
          --family "${{ inputs.family }}"
          --version "${{ inputs.version }}"

      - name: Pin release source
        id: source
        run: echo "release_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  publish:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout pinned release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Guard release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "Checked out source does not match the pinned release SHA." >&2
            exit 1
          fi

          git fetch origin "${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "Release source must be reachable from origin/${DEFAULT_BRANCH}." >&2
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify source
        run: bash scripts/verify.sh

      - name: Pack selected package family
        run: >-
          bash scripts/pack-package-family.sh
          --family "${{ needs.prepare-release.outputs.family }}"
          --version "${{ needs.prepare-release.outputs.version }}"
          --output artifacts/packages

      - name: Verify selected package family
        run: >-
          bash scripts/verify-package-family.sh
          --family "${{ needs.prepare-release.outputs.family }}"
          --version "${{ needs.prepare-release.outputs.version }}"
          --package-dir artifacts/packages

      - name: Inspect NuGet publication state
        id: nuget_state
        uses: mackysoft/actions/nuget/package-state@v1
        with:
          mode: inspect
          package-version: ${{ needs.prepare-release.outputs.version }}
          package-ids: ${{ needs.prepare-release.outputs.package_ids }}

      - name: Validate NuGet Trusted Publishing user
        if: ${{ steps.nuget_state.outputs['publish-required'] == 'true' }}
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail

          if [[ "${NUGET_USER}" != "makihiro_dev" ]]; then
            echo "Repository variable NUGET_USER must be makihiro_dev." >&2
            exit 2
          fi

      - name: Publish selected package family to nuget.org
        if: ${{ steps.nuget_state.outputs['publish-required'] == 'true' }}
        uses: mackysoft/actions/nuget/trusted-publish@v1
        with:
          package-glob: artifacts/packages/*.nupkg
          nuget-user: ${{ vars.NUGET_USER }}

      - name: Wait for selected package family
        uses: mackysoft/actions/nuget/package-state@v1
        with:
          mode: wait
          package-version: ${{ needs.prepare-release.outputs.version }}
          package-ids: ${{ needs.prepare-release.outputs.package_ids }}
          max-attempts: 90
          interval-seconds: 10

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FAMILY: ${{ needs.prepare-release.outputs.family }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
            actual_sha="$(git rev-list -n 1 "refs/tags/${TAG_NAME}")"
            if [[ "${actual_sha}" != "${RELEASE_SHA}" ]]; then
              echo "Existing release tag ${TAG_NAME} points to ${actual_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
            gh release upload "${TAG_NAME}" artifacts/packages/*.nupkg --clobber
          else
            gh release create "${TAG_NAME}" artifacts/packages/*.nupkg \
              --target "${RELEASE_SHA}" \
              --title "${FAMILY} ${VERSION}" \
              --notes ""
          fi
